name: Deploy to Pockethost

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project root relative to the caller repository.
        required: false
        type: string
        default: .
    secrets:
      POCKETHOST_SFTP_USERNAME:
        required: false
      POCKETHOST_SFTP_PRIVATE_KEY:
        required: false
      POCKETHOST_INSTANCE_NAME:
        required: false

permissions:
  contents: read

concurrency:
  group: pockethost-deploy-${{ github.ref_name }}-${{ inputs.working-directory }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'staging' && 'staging' || 'production' }}
    env:
      POCKETHOST_WORKDIR: ${{ inputs.working-directory }}
      POCKETHOST_SFTP_USERNAME: ${{ secrets.POCKETHOST_SFTP_USERNAME }}
      POCKETHOST_SFTP_PRIVATE_KEY: ${{ secrets.POCKETHOST_SFTP_PRIVATE_KEY }}
      POCKETHOST_INSTANCE_NAME: ${{ vars.POCKETHOST_INSTANCE_NAME != '' && vars.POCKETHOST_INSTANCE_NAME || secrets.POCKETHOST_INSTANCE_NAME }}
      POCKETHOST_SFTP_HOST: ftp.pockethost.io
      POCKETHOST_SFTP_PORT: 2222

    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$POCKETHOST_WORKDIR" ]; then
            echo "Working directory does not exist: $POCKETHOST_WORKDIR" >&2
            exit 1
          fi

          if [ ! -d "$POCKETHOST_WORKDIR/pb_public" ]; then
            echo "Missing $POCKETHOST_WORKDIR/pb_public directory." >&2
            exit 1
          fi

          if [ -z "${POCKETHOST_SFTP_USERNAME:-}" ]; then
            echo "Missing POCKETHOST_SFTP_USERNAME in the selected GitHub Environment." >&2
            exit 1
          fi

          if [ -z "${POCKETHOST_SFTP_PRIVATE_KEY:-}" ]; then
            echo "Missing POCKETHOST_SFTP_PRIVATE_KEY in the selected GitHub Environment." >&2
            exit 1
          fi

          if [ -z "${POCKETHOST_INSTANCE_NAME:-}" ]; then
            echo "Missing POCKETHOST_INSTANCE_NAME in the selected GitHub Environment." >&2
            exit 1
          fi

      - name: Deploy pb_public via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ env.POCKETHOST_SFTP_USERNAME }}
          server: ${{ env.POCKETHOST_SFTP_HOST }}
          port: ${{ env.POCKETHOST_SFTP_PORT }}
          ssh_private_key: ${{ env.POCKETHOST_SFTP_PRIVATE_KEY }}
          local_path: ${{ inputs.working-directory }}/pb_public/*
          remote_path: /${{ env.POCKETHOST_INSTANCE_NAME }}/pb_public
          sftp_only: true

      - name: Deploy pb_hooks via SFTP
        if: hashFiles(format('{0}/pb_hooks/**', inputs.working-directory)) != ''
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ env.POCKETHOST_SFTP_USERNAME }}
          server: ${{ env.POCKETHOST_SFTP_HOST }}
          port: ${{ env.POCKETHOST_SFTP_PORT }}
          ssh_private_key: ${{ env.POCKETHOST_SFTP_PRIVATE_KEY }}
          local_path: ${{ inputs.working-directory }}/pb_hooks/*
          remote_path: /${{ env.POCKETHOST_INSTANCE_NAME }}/pb_hooks
          sftp_only: true

      - name: Deploy pb_migrations via SFTP
        if: hashFiles(format('{0}/pb_migrations/**', inputs.working-directory)) != ''
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ env.POCKETHOST_SFTP_USERNAME }}
          server: ${{ env.POCKETHOST_SFTP_HOST }}
          port: ${{ env.POCKETHOST_SFTP_PORT }}
          ssh_private_key: ${{ env.POCKETHOST_SFTP_PRIVATE_KEY }}
          local_path: ${{ inputs.working-directory }}/pb_migrations/*
          remote_path: /${{ env.POCKETHOST_INSTANCE_NAME }}/pb_migrations
          sftp_only: true

      - name: Wait for deployment to settle
        run: sleep 5

      - name: Run health check
        shell: bash
        env:
          HEALTHCHECK_BASE_URL: ${{ vars.HEALTHCHECK_BASE_URL }}
        run: |
          set -euo pipefail
          target_url="${HEALTHCHECK_BASE_URL:-https://${POCKETHOST_INSTANCE_NAME}.pockethost.io}"
          curl --fail --silent --show-error --location "$target_url" >/dev/null
          echo "Healthcheck passed for $target_url"
