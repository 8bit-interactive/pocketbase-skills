version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pocketbase-pockethost
    main: ./cli/cmd/pocketbase-pockethost
    binary: pocketbase-pockethost
    ldflags:
      - -s -w -X main.cliVersion={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      pocketbase-pockethost_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
